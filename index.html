<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutual Fund Investment Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fc;
    }

    .header{
      background:linear-gradient(135deg,#0b5ed7,#084298);
      color:white;
      text-align:center;
      padding:50px 20px;
    }

    .header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .header p{
      font-size:18px;
    }

    .container{
      max-width:900px;
      background:white;
      margin:40px auto;
      padding:40px;
      border-radius:15px;
      box-shadow:0px 5px 20px rgba(0,0,0,0.1);
    }

    h2{
      margin-bottom:20px;
      color:#0b5ed7;
    }

    .form-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    input, select{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
    }

    input:focus, select:focus{
      border-color:#0b5ed7;
      outline:none;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    button{
      width:100%;
      padding:15px;
      background:#0b5ed7;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#084298;
    }

    @media(max-width:768px){
      .row{
        grid-template-columns:1fr;
      }

      .header h1{
        font-size:30px;
      }
    }

  </style>
</head>

<body>

  <div class="header">
    <h1>Mutual Fund Investment Portal</h1>
    <p>Professional Investment Registration & KYC Form</p>
  </div>

  <div class="container">

    <h2>Client Information</h2>

    <form>

      <div class="row">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" placeholder="Enter mobile number">
        </div>

      </div>

      <div class="row">

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter email address">
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" placeholder="Enter city">
        </div>

      </div>

      <div class="row">

        <div class="form-group">
          <label>Investment Goal</label>

          <select>
            <option>Wealth Creation</option>
            <option>Tax Saving</option>
            <option>Retirement</option>
            <option>Emergency Fund</option>
          </select>
        </div>

        <div class="form-group">
          <label>Monthly Investment</label>

          <select>
            <option>₹1,000 - ₹5,000</option>
            <option>₹5,000 - ₹25,000</option>
            <option>₹25,000 - ₹1,00,000</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label>Occupation</label>
        <input type="text" placeholder="Enter occupation">
      </div>

      <button type="submit">Submit Registration</button>

    </form>

  </div>

</body>
</html>
